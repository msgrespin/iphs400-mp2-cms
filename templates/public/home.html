{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  <section>
    {{ home.body_html }}
  </section>
  {% if latest %}
  <article>
    <h2>{{ latest.title }}</h2>
    <p class="date">{{ latest.date }}</p>
    {{ latest.body_html }}
  </article>
  {% else %}
    <p>Nothing published yet.</p>
  {% endif %}
  <p><a href="{{ past_href }}">Past posts</a></p>
{% endblock %}
