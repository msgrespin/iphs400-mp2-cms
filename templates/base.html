<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ css_path | default('style.css') }}">
</head>
<body>
  <header><a href="{{ home_path | default('index.html') }}">{{ title }}</a></header>
  {% if console_account %}
  <nav aria-label="Console">
    <ul>
      <li><a href="{{ url_for('console_dashboard') }}">Dashboard</a></li>
      <li><a href="{{ url_for('console_content') }}">Content</a></li>
      <li><a href="{{ url_for('post_new') }}">New Post</a></li>
      <li>{{ console_account.display_name }}</li>
      <li>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">Sign out</button>
        </form>
      </li>
    </ul>
  </nav>
  {% endif %}
  {% if nav %}
  <nav aria-label="Site">
    <ul>
      {% for item in nav %}<li><a href="{{ item.href }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
