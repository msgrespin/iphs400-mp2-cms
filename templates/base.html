<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ css_path | default('style.css') }}">
</head>
<body>
  <header><a href="{{ home_path | default('index.html') }}">{{ title }}</a></header>
  {% if nav %}
  <nav aria-label="Site">
    <ul>
      {% for item in nav %}<li><a href="{{ item.href }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
