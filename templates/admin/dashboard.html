{% extends "base.html" %}
{% block content %}
  <h1>Dashboard</h1>
  {% include "admin/_flash.html" %}
  <dl class="counts">
    <div><dt>Draft Posts</dt> <dd>{{ counts.draft_posts }}</dd></div>
    <div><dt>Published Posts</dt> <dd>{{ counts.published_posts }}</dd></div>
    <div><dt>Pages</dt> <dd>{{ counts.pages }}</dd></div>
  </dl>
  <p><a href="{{ url_for('console_content') }}">See all content</a> · <a href="{{ url_for('posts_list') }}">Posts</a> · <a href="{{ url_for('pages_list') }}">Pages</a></p>
{% endblock %}
